name: Apply yt-dlp patch

# Run ONCE: Actions -> "Apply yt-dlp patch" -> Run workflow.
# Needs ytdlp-overlay.zip in the repository root.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply overlay
        run: |
          test -f ytdlp-overlay.zip
          unzip -q -o ytdlp-overlay.zip -d _overlay
          cp -a _overlay/files/. .
          xargs -a _overlay/DELETED.txt -r rm -f
          find app/src/main/res -type d -empty -delete
          rm -rf _overlay ytdlp-overlay.zip

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add yt-dlp tab, playlist folders, English-only UI"
          git push

name: Build APK

# Run it by hand: Actions -> "Build APK" -> "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Install ninja-build
        run: sudo apt-get install -y ninja-build

      - name: Check out repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "jetbrains"
          cache: gradle

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/Auxio-ytdlp-debug.apk
          ls -lh out

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auxio-ytdlp-apk
          path: out/Auxio-ytdlp-debug.apk

      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Auxio yt-dlp build ${{ github.run_number }}
          files: out/Auxio-ytdlp-debug.apk
